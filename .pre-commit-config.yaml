repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uvx --from ruff==0.16.4 ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format check
        entry: uvx --from ruff==0.16.4 ruff format --check .
        language: system
        pass_filenames: false
